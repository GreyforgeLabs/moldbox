[package]
name = "moldbox"
version = "0.4.2"
edition = "2024"
description = "Consistent SQLite online backups and explicit WAL checkpoint control"
license = "AGPL-3.0-only"
repository = "https://github.com/GreyforgeLabs/moldbox"
homepage = "https://greyforge.tech"
readme = "README.md"
keywords = ["sqlite", "wal", "checkpoint", "backup", "cli"]
categories = ["command-line-utilities", "database"]
rust-version = "1.88"
default-run = "moldbox"
exclude = ["/.github", "/docs/assets", "/release", "/scripts"]

[lib]
name = "moldbox"
path = "src/lib.rs"

[[bin]]
name = "moldbox"
path = "src/main.rs"

# Deprecated alias for the former name. It prints a one-line deprecation note
# to stderr and then behaves exactly like `moldbox`. It will be removed in a
# future release.
[[bin]]
name = "sqlite-checkpoint"
path = "src/bin/sqlite-checkpoint.rs"

[dependencies]
# libc is used only for the O_NOFOLLOW / O_DIRECTORY open flags and errno
# constants; the crate forbids unsafe code.
libc = { version = "=0.2.189", default-features = false }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "backup"] }
sha2 = { version = "=0.10.9", default-features = false }
# signal-hook records SIGINT/SIGTERM/SIGHUP in the CLI so an interrupted
# backup can remove its temporary file before the process exits.
signal-hook = { version = "=0.4.5", default-features = false }

[dev-dependencies]
assert_cmd = "=2.2.0"
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Temporary-file cleanup is explicit on every error path (including the
# signal-interrupt path) and never relies on Drop during unwinding, so
# aborting on panic is safe.
panic = "abort"
